name: client_youtubei
description: Embedded pinned YouTube.js runtime for the Listenbox Dart client.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.0
resolution: workspace
dependencies:
  archive: ^4.3.0
  fjs: 3.3.0
  flutter_rust_bridge: 2.12.0
  hooks: ^2.2.0
  code_assets: ^2.1.0
  crypto: ^3.0.6
flutter:
  plugin:
    # The native-asset hook delivers pinned FJS binaries while Dart uses the
    # unmodified upstream package; override only Flutter's native packaging.
    implements: fjs
    platforms:
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
